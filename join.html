<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Killer Pool — Follow Along</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; min-height: 100%;
    background: #0c1117;
    color: #e8edf2;
    /* Matches the app's own switch away from Barlow - Helvetica Neue is a
       system font on iOS/macOS (no download), standard fallback elsewhere. */
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .stage {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 8vh 8vw 130px;
  }
  /* Purple/gold rebrand (was the neon-lime #D0F30D family) - colors
     matched to the app's actual current CSS, not just a hex swap: the
     round-badge pill is the app's real neutral navy pill (round-badge
     class in KillerPool.jsx), "UP NOW"/idle-title use the gold hand-fixed
     for the hero card specifically (not the generic darker gold-shade
     used elsewhere), and .pip.on mirrors LifePips' non-dark fill/border. */
  .round-badge {
    font-size: 14px;
    letter-spacing: 3px;
    color: #546e7a;
    font-weight: 700;
    background: #1a2535;
    border: 1px solid #1e2d40;
    border-radius: 100px;
    padding: 6px 16px;
    margin-bottom: 24px;
  }
  .round-badge b { color: #D99E38; }
  .up-now-label {
    font-size: 13px;
    letter-spacing: 3px;
    color: #D99E38;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .player-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 16vw, 96px);
    letter-spacing: 3px;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 60px rgba(217,158,56,0.25);
    margin-bottom: 20px;
    word-break: break-word;
  }
  .pips { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .pip {
    width: 20px; height: 20px; border-radius: 50%;
    background: #1e2530; border: 2px solid #3a4250;
  }
  .pip.on { background: #D99E38; border-color: #CB8F27; }
  .status-line {
    font-size: 15px;
    color: #78909c;
    margin-top: 12px;
  }
  .status-line b { color: #e8edf2; }
  /* Full roster, not just whose turn it is - a real report: "eliminated,
     winner, big updates about the player list should appear there." Was
     entirely missing from the schema (games/{gameId} only ever tracked
     the current turn) - see updateGameLiveState()'s new `players` field. */
  .roster {
    width: 100%; max-width: 320px;
    margin-top: 24px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .roster-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    background: #131c27; border: 1px solid #1e2d40; border-radius: 10px;
    font-size: 15px;
  }
  .roster-row.eliminated { opacity: 0.45; }
  .roster-row.current { border-color: #D99E38; background: #271B07; }
  .roster-name { display: flex; align-items: center; gap: 8px; }
  .roster-name .tag { font-size: 11px; letter-spacing: 1px; color: #D99E38; font-weight: 700; }
  .roster-lives { display: flex; gap: 4px; }
  .roster-lives .pip { width: 10px; height: 10px; }
  .winner-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 12vw, 72px);
    letter-spacing: 3px;
    color: #D99E38;
    margin-bottom: 6px;
  }
  .winner-sub { font-size: 15px; color: #78909c; margin-bottom: 8px; }
  .idle-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 10vw, 56px);
    letter-spacing: 4px;
    color: #D99E38;
  }
  .idle-sub {
    font-size: 14px;
    letter-spacing: 2px;
    color: #909AAC;
    margin-top: 16px;
    max-width: 320px;
  }
  .pool-ball {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a3a3a, #0a0a0a 70%);
    border: 1.5px solid #D99E38;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: #fff;
    margin-bottom: 20px;
  }
  .footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 16px 8vw calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, #0c1117 40%, transparent);
  }
  .footer-note {
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    color: #2a3545;
  }
  /* Live-status row: this page updates itself automatically (a Firestore
     realtime listener, not polling) - but mobile browsers commonly
     suspend a backgrounded/locked-screen tab's network activity, and
     the listener can take a moment to reconnect once it's foregrounded
     again. Rather than leave that invisible (a viewer just sees a frozen
     screen with no way to tell "is this stuck or just quiet"), show when
     the last update landed, plus a manual refresh as a safety net. */
  .live-status {
    position: fixed; top: 14px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 12px; color: #546e7a; letter-spacing: 0.5px;
  }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #43a047; flex-shrink: 0; }
  .live-dot.stale { background: #909AAC; }
  .refresh-btn {
    background: transparent; border: 1px solid #253040; color: #909AAC;
    border-radius: 100px; padding: 3px 10px; font-size: 12px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    cursor: pointer;
  }
  .app-store-link {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 28px;
    color: #D99E38; text-decoration: none;
    font-size: 14px; font-weight: 700; letter-spacing: 0.5px;
    border: 1px solid #7C5718; border-radius: 100px;
    padding: 8px 18px;
  }
</style>
</head>
<body>
  <div class="live-status" id="liveStatus" hidden>
    <span class="live-dot" id="liveDot"></span>
    <span id="liveText">updated just now</span>
    <button class="refresh-btn" id="refreshBtn" onclick="location.reload()">↻ Refresh</button>
  </div>
  <div class="stage" id="stage">
    <div class="pool-ball">8</div>
    <div class="idle-title">CONNECTING…</div>
  </div>
  <div class="footer">
    <!-- Standard App Store URL format (id-only, no name slug needed) -
         App Apple ID confirmed via App Store Connect (6802345932). A
         spectator following a game with no app installed is exactly the
         audience most worth putting this in front of. -->
    <a class="app-store-link" href="https://apps.apple.com/app/id6802345932" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      Get Killer Pool on the App Store
    </a>
    <div class="footer-note">KILLER POOL — LIVE SPECTATOR VIEW</div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  // Same public config as the app itself (src/firebase.js) - safe to
  // ship here for the same reason it's safe in the app bundle: access is
  // restricted by Firestore security rules, not by keeping this object
  // secret. This page only ever reads (games/{gameId} is open-read for
  // anyone who knows the id - see firestore.rules) - never writes.
  const firebaseConfig = {
    apiKey: "AIzaSyCIJ452REbkJht4QlJwuP3kt8zS6OqdAPs",
    authDomain: "killer-pool-app.firebaseapp.com",
    projectId: "killer-pool-app",
    storageBucket: "killer-pool-app.firebasestorage.app",
    messagingSenderId: "149372024371",
    appId: "1:149372024371:web:cdab410678e1f4c6845546",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const stage = document.getElementById('stage');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function renderMessage(title, sub) {
    stage.innerHTML = `
      <div class="pool-ball">8</div>
      <div class="idle-title">${escapeHtml(title)}</div>
      <div class="idle-sub">${escapeHtml(sub || '')}</div>
    `;
  }

  // Shared by the live-turn view and the winner view - a full roster,
  // not just whose turn it currently is. `current` marks the player
  // whose turn it is right now (irrelevant once the game's over, so
  // renderWinner doesn't pass a currentName).
  function renderRoster(players, currentName) {
    if (!Array.isArray(players) || players.length === 0) return '';
    const rows = players.map(p => {
      const isCurrent = p.name === currentName;
      const maxLives = Math.max(p.lives || 0, 1);
      const pips = Array.from({ length: maxLives }, (_, i) =>
        `<div class="pip ${i < p.lives ? 'on' : ''}"></div>`
      ).join('');
      return `
        <div class="roster-row ${p.eliminated ? 'eliminated' : ''} ${isCurrent ? 'current' : ''}">
          <div class="roster-name">
            ${escapeHtml(p.name)}
            ${isCurrent ? '<span class="tag">UP NOW</span>' : ''}
            ${p.eliminated ? '<span class="tag" style="color:#ef5350">OUT</span>' : ''}
          </div>
          <div class="roster-lives">${pips}</div>
        </div>
      `;
    }).join('');
    return `<div class="roster">${rows}</div>`;
  }

  function renderGame(state) {
    // Same shape the app sends to the Chromecast receiver (see
    // Cast.sendGame in KillerPool.jsx / updateGameLiveState in
    // src/firebase.js): { round, currentPlayerName, lives, defaultLives,
    // aliveCount, totalPlayers, players }
    const total = Math.max(state.defaultLives || 3, state.lives || 0);
    const pips = Array.from({ length: total }, (_, i) =>
      `<div class="pip ${i < state.lives ? 'on' : ''}"></div>`
    ).join('');
    stage.innerHTML = `
      <div class="round-badge">ROUND <b>${state.round ?? 1}</b></div>
      <div class="up-now-label">UP NOW</div>
      <div class="player-name">${escapeHtml(state.currentPlayerName || '')}</div>
      <div class="pips">${pips}</div>
      <div class="status-line"><b>${state.aliveCount ?? '–'}</b> of <b>${state.totalPlayers ?? '–'}</b> players remaining</div>
      ${renderRoster(state.players, state.currentPlayerName)}
    `;
  }

  function renderWinner(state) {
    stage.innerHTML = `
      <div class="pool-ball">8</div>
      <div class="winner-title">${escapeHtml(state.winnerName || 'SOMEONE')} WINS</div>
      <div class="winner-sub">Game over — round ${state.round ?? 1}</div>
      ${renderRoster(state.players, null)}
    `;
  }

  // Live-status indicator: this page updates itself via a Firestore
  // realtime listener, no manual refresh needed in normal use - but
  // mobile browsers commonly suspend a backgrounded/locked-screen tab's
  // network activity, and the listener can take a moment to reconnect
  // once it's foregrounded again. Rather than leave a viewer guessing
  // "is this frozen or just quiet," track when the last update actually
  // landed and show it - plus a manual refresh (a full page reload,
  // guaranteed to force a fresh connection) as a safety net.
  const liveStatus = document.getElementById('liveStatus');
  const liveDot = document.getElementById('liveDot');
  const liveText = document.getElementById('liveText');
  let lastUpdate = null;
  function markUpdated() {
    lastUpdate = Date.now();
    liveStatus.hidden = false;
  }
  function tickLiveStatus() {
    if (!lastUpdate) return;
    const secs = Math.round((Date.now() - lastUpdate) / 1000);
    const stale = secs > 25;
    liveDot.classList.toggle('stale', stale);
    if (secs < 5) liveText.textContent = 'updated just now';
    else if (secs < 60) liveText.textContent = `updated ${secs}s ago`;
    else liveText.textContent = `updated ${Math.round(secs / 60)}m ago${stale ? ' — try refresh' : ''}`;
  }
  setInterval(tickLiveStatus, 1000);
  // Re-check promptly when the tab comes back to the foreground, rather
  // than waiting up to a full second for the next tick to reveal a stale
  // connection - this is the exact moment a suspended listener would
  // need noticing.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tickLiveStatus(); });

  const params = new URLSearchParams(location.search);
  const gameId = params.get('game');

  if (!gameId) {
    renderMessage('NO GAME LINKED', 'This link is missing a game id — ask the organiser to re-share it.');
  } else {
    onSnapshot(
      doc(db, 'games', gameId),
      (snap) => {
        markUpdated();
        if (!snap.exists()) {
          renderMessage('GAME NOT FOUND', "This game doesn't exist or has ended.");
          return;
        }
        const state = snap.data();
        if (state.gameOver) {
          renderWinner(state);
          return;
        }
        if (!state.currentPlayerName) {
          renderMessage('WAITING FOR THE FIRST SHOT…', '');
          return;
        }
        renderGame(state);
      },
      (err) => {
        console.error('Live game listener failed', err);
        renderMessage('CONNECTION LOST', "Couldn't reach the game — check your connection and reopen this link.");
      }
    );
  }
</script>
</body>
</html>
