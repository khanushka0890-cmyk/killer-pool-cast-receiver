<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Killer Pool — Follow Along</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap');
  :root {
    --bg:#0B0A12; --surface:#15131F; --border:#2A2640; --border-2:#4A4463;
    --felt:#2D1A55; --stub:#1E1238; --deep:#1A1030;
    --gold:#F2B84B; --gold-text:#F5C76A; --gold-line:rgba(242,184,75,.55);
    --text:#F4F1FA; --text-2:#CBC2E0; --text-muted:#8C86A3;
    --live:#F0625A; --danger-text:#FF8A83; --success:#5BD08A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  a { color: var(--gold); }
  a:hover { color: #FFD27A; }
  button { font-family: inherit; }
  .felt {
    background-color: var(--felt);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.024) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.09) 0 1px, transparent 1px 4px);
  }
  .page { max-width: 480px; margin: 0 auto; padding: 0 16px 150px; }

  /* Header: brand mark (left) + live pill (right) */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 12px; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-ball { width: 28px; height: 28px; border-radius: 50%; background: var(--bg); box-shadow: 0 0 0 1.5px var(--gold); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-text { display: flex; flex-direction: column; gap: 1px; line-height: 1; }
  .brand-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1.5px; color: var(--gold); }
  .brand-sub { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; }
  .live-pill {
    height: 36px; display: flex; align-items: center; gap: 8px;
    padding: 0 12px 0 10px; border-radius: 18px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-2); font-size: 13px; cursor: pointer; flex-shrink: 0;
  }
  .live-pill[hidden] { display: none; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .live-dot.stale { background: var(--text-muted); }

  /* Content column */
  .stage { display: flex; flex-direction: column; gap: 20px; padding-top: 8px; }
  .centered-msg { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; }

  /* Hero ticket */
  .ticket { position: relative; filter: drop-shadow(0 18px 30px rgba(91,42,158,.45)); }
  .ticket-top {
    border: 1px solid var(--gold-line); border-bottom: none; border-radius: 22px 22px 0 0;
    padding: 22px 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .round-badge {
    height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 10px;
    background: rgba(11,10,18,.45); border: 1px solid rgba(242,184,75,.35);
    display: flex; align-items: center; gap: 8px;
  }
  .round-badge .lbl { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 2px; color: var(--text-2); }
  .round-badge .num { font-family: 'Bebas Neue', sans-serif; font-size: 26px; line-height: 26px; color: var(--gold); padding-top: 3px; }
  .up-now-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 3px; padding-left: 3px; color: var(--gold-text); margin-top: 8px; }
  .player-name { font-family: 'Bebas Neue', sans-serif; font-size: clamp(52px, 16vw, 88px); line-height: 1; letter-spacing: 2px; padding-left: 2px; color: var(--gold); word-break: break-word; text-align: center; }
  .pips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .pip { width: 22px; height: 22px; border-radius: 50%; background: var(--gold); box-shadow: inset -2px -2px 0 rgba(0,0,0,.22), inset 1px 1px 0 rgba(255,255,255,.35); flex-shrink: 0; }
  .pip.off { background: transparent; box-shadow: none; border: 1.5px solid var(--border-2); }

  .perf { position: relative; height: 24px; display: flex; align-items: center; padding: 0 22px; background: var(--stub); border-left: 1px solid var(--gold-line); border-right: 1px solid var(--gold-line); }
  .perf-line { flex-grow: 1; border-top: 2px dashed rgba(242,184,75,.4); }
  .perf-hole { position: absolute; top: 0; width: 24px; height: 24px; border-radius: 50%; box-sizing: border-box; background: var(--bg); }
  .perf-hole.l { left: -13px; border-right: 1px solid var(--gold-line); }
  .perf-hole.r { right: -13px; border-left: 1px solid var(--gold-line); }

  .ticket-stub { background: var(--stub); border: 1px solid var(--gold-line); border-top: none; border-radius: 0 0 22px 22px; padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
  .progress-row { display: flex; flex-direction: column; gap: 8px; }
  .progress-label { display: flex; justify-content: space-between; align-items: baseline; }
  .progress-label .lbl { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2.5px; color: var(--text-2); }
  .progress-label .val { font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .progress-label .val b { color: var(--text); }
  .progress-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); }
  .progress-fill { height: 100%; border-radius: 3px; background: var(--gold); }
  .hairline { height: 1px; background: rgba(255,255,255,.08); }
  .remaining-row { display: flex; flex-direction: column; gap: 8px; }
  .remaining-row .txt { font-size: 15px; color: var(--text-2); }
  .remaining-row .txt b { color: var(--text); }
  .seg-track { display: flex; gap: 4px; }
  .seg { flex: 1; height: 6px; border-radius: 3px; background: var(--gold); }
  .seg.off { background: rgba(255,255,255,.14); }

  /* Players section */
  .players-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; }
  .players-head h2 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 22px; letter-spacing: 2.5px; color: var(--text-2); }
  .players-head .count { font-size: 14px; color: var(--text-muted); }
  .roster { display: flex; flex-direction: column; gap: 8px; }
  .roster-row {
    display: flex; align-items: center; gap: 12px; padding: 0 16px 0 12px;
    height: 68px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border);
  }
  .roster-row.current { background: rgba(242,184,75,.1); border: 1.5px solid var(--gold); }
  .av { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; color: #fff; overflow: hidden; }
  .roster-row.current .av { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--gold); }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .roster-info { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .roster-name { font-size: 17px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .roster-tag { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; }
  .roster-tag.up { color: var(--gold); }
  .roster-tag.last { color: var(--danger-text); }
  .roster-pips { display: flex; gap: 5px; flex-shrink: 0; }
  .roster-pips .pip { width: 12px; height: 12px; }

  .out-divider { display: flex; align-items: center; gap: 10px; padding: 8px 4px 0; }
  .out-divider .lbl { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 2px; color: var(--text-muted); }
  .out-divider .line { flex-grow: 1; height: 1px; background: var(--border); }
  .out-row { height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 12px; border-radius: 16px; border: 1px dashed var(--border); }
  .out-row .av { width: 36px; height: 36px; font-size: 16px; background: var(--border); color: var(--text-muted); }
  .out-row .roster-name { color: var(--text-muted); font-weight: 500; }
  .out-row .out-note { font-size: 13px; color: var(--text-muted); flex-shrink: 0; }

  /* Sponsor promo banner - deliberately an ivory ad strip (light
     background, AD tag), not another dark ticket card - per the
     sponsor-promo design doc: "it must read as an ad, not a game
     element." Same component in spirit as the in-app Spectate screen's
     SponsorBanner, just plain HTML/CSS here since this page isn't part
     of that bundle. */
  .sponsor { background: #F7EEDC; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 0 0 1px rgba(242,184,75,.5); }
  .sponsor__top { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
  .sponsor__ad { height: 20px; padding: 0 7px 0 8px; border-radius: 4px; background: #1A1030; color: #F7EEDC; display: inline-flex; align-items: center; font: 700 11px/1 'Barlow Condensed', sans-serif; letter-spacing: 1.2px; }
  .sponsor__label { font: 700 12px/1.2 'Barlow Condensed', sans-serif; letter-spacing: 1.5px; color: #6B5E80; }
  .sponsor__img { display: block; width: 100%; aspect-ratio: 3/2; object-fit: cover; border-radius: 6px; }
  .sponsor__headline { margin: 0; padding: 0 2px 2px; font: 700 16px/21px 'Barlow', sans-serif; color: #1A1030; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sponsor__headline-only { display: flex; align-items: center; gap: 12px; padding: 0 2px 2px; }
  .sponsor__tag { width: 44px; height: 44px; flex-shrink: 0; border-radius: 8px; background: #1A1030; color: #F5C76A; display: flex; align-items: center; justify-content: center; }
  .sponsor__headline-only .sponsor__headline { font: 700 16px/21px 'Barlow', sans-serif; color: #1A1030; white-space: normal; overflow: visible; text-overflow: clip; padding: 0; }

  /* Winner state - kept as its own simpler layout, not the ticket pattern */
  .pool-ball {
    width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a3a3a, #0a0a0a 70%);
    border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #fff;
  }
  .winner-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(40px, 12vw, 72px); letter-spacing: 3px; color: var(--gold); }
  .winner-sub { font-size: 15px; color: var(--text-muted); }
  .idle-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px, 10vw, 56px); letter-spacing: 4px; color: var(--gold); }
  .idle-sub { font-size: 14px; letter-spacing: 2px; color: var(--text-muted); max-width: 320px; }

  /* Sticky App Store bar */
  .appstore-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    background: rgba(11,10,18,.92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    display: flex; justify-content: center; z-index: 10;
  }
  .appstore-btn {
    width: 100%; max-width: 440px; height: 56px; box-sizing: border-box; border-radius: 28px;
    border: 2px solid var(--gold); background: var(--bg); color: var(--gold);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    text-decoration: none; font-weight: 700; font-size: 18px; letter-spacing: .3px; white-space: nowrap;
  }
  .footer-note { text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 2.5px; color: #5E5874; margin: 8px 0 0; }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <span class="brand-ball">
          <svg width="22" height="22" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#0B0A12" stroke="#0B0A12" stroke-width="1"></circle><circle cx="13" cy="13" r="6" fill="#F4F1FA"></circle><text x="13" y="16.5" text-anchor="middle" font-family="Barlow, sans-serif" font-weight="700" font-size="9" fill="#0B0A12">8</text></svg>
        </span>
        <span class="brand-text">
          <span class="brand-title">Killer Pool</span>
          <span class="brand-sub">elimination</span>
        </span>
      </div>
      <button class="live-pill" id="livePill" hidden aria-label="Refresh" onclick="location.reload()">
        <span class="live-dot" id="liveDot"></span>
        <span id="liveText">Updated just now</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>
      </button>
    </div>
    <div class="stage" id="stage">
      <div class="centered-msg">
        <div class="pool-ball">8</div>
        <div class="idle-title">CONNECTING…</div>
      </div>
    </div>
  </div>
  <div class="appstore-bar">
    <!-- Standard App Store URL format (id-only, no name slug needed) -
         App Apple ID confirmed via App Store Connect (6802345932). A
         spectator following a game with no app installed is exactly the
         audience most worth putting this in front of. -->
    <a class="appstore-btn" href="https://apps.apple.com/app/id6802345932" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      Get Killer Pool on the App Store
    </a>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  // Same public config as the app itself (src/firebase.js) - safe to
  // ship here for the same reason it's safe in the app bundle: access is
  // restricted by Firestore security rules, not by keeping this object
  // secret. This page only ever reads (games/{gameId} is open-read for
  // anyone who knows the id - see firestore.rules) - never writes.
  const firebaseConfig = {
    apiKey: "AIzaSyCIJ452REbkJht4QlJwuP3kt8zS6OqdAPs",
    authDomain: "killer-pool-app.firebaseapp.com",
    projectId: "killer-pool-app",
    storageBucket: "killer-pool-app.firebasestorage.app",
    messagingSenderId: "149372024371",
    appId: "1:149372024371:web:cdab410678e1f4c6845546",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const stage = document.getElementById('stage');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function avatarHtml(p, size) {
    const initial = escapeHtml((p.name?.[0] || '?').toUpperCase());
    const fontSize = Math.round(size * 0.44);
    if (p.avatarPhoto) return `<div class="av" style="width:${size}px;height:${size}px;"><img src="${p.avatarPhoto}" alt="" /></div>`;
    return `<div class="av" style="width:${size}px;height:${size}px;font-size:${fontSize}px;background:${p.avatarColor || '#546e7a'};">${initial}</div>`;
  }

  function renderMessage(title, sub) {
    stage.innerHTML = `
      <div class="centered-msg">
        <div class="pool-ball">8</div>
        <div class="idle-title">${escapeHtml(title)}</div>
        <div class="idle-sub">${escapeHtml(sub || '')}</div>
      </div>
    `;
  }

  // Still-in players first (turn order when the organizer opted in via
  // Public turn info, alphabetical otherwise - same reasoning as the
  // in-app Spectate screen), knocked-out players under a dashed OUT
  // divider, most recently eliminated first. Mirrors KillerPool.jsx's
  // own Spectate roster exactly (see its own comment for the same
  // showTurnOrder gating).
  function renderPlayers(players, currentName, showTurnOrder = true) {
    if (!Array.isArray(players) || players.length === 0) return '';
    const stillIn = players.filter(p => !p.eliminated);
    const out = players.filter(p => p.eliminated).sort((a, b) => (b.eliminatedInRound ?? 0) - (a.eliminatedInRound ?? 0));
    const ordered = showTurnOrder ? stillIn : [...stillIn].sort((a, b) => a.name.localeCompare(b.name));

    const rows = ordered.map(p => {
      // Who's shooting right now is live, observable info - not a leak
      // the way the FUTURE turn sequence would be. showTurnOrder only
      // gates the list's ORDER (turn order vs alphabetical) above; the
      // current-player highlight itself is never hidden.
      const isCurrent = p.name === currentName;
      const lastLife = p.lives === 1;
      const maxLives = Math.max(p.lives || 0, 1);
      const pips = Array.from({ length: maxLives }, (_, i) =>
        `<span class="pip ${i < p.lives ? '' : 'off'}"></span>`
      ).join('');
      return `
        <div class="roster-row ${isCurrent ? 'current' : ''}">
          ${avatarHtml(p, 40)}
          <div class="roster-info">
            <span class="roster-name">${escapeHtml(p.name)}</span>
            ${isCurrent ? '<span class="roster-tag up">UP NOW</span>' : lastLife ? '<span class="roster-tag last">LAST LIFE</span>' : ''}
          </div>
          <div class="roster-pips">${pips}</div>
        </div>
      `;
    }).join('');

    const outRows = out.map(p => `
      <div class="out-row" aria-label="${escapeHtml(p.name)}, out${p.eliminatedInRound ? ` in round ${p.eliminatedInRound}` : ''}">
        ${avatarHtml(p, 36)}
        <span class="roster-name" style="flex-grow:1;min-width:0;">${escapeHtml(p.name)}</span>
        ${p.eliminatedInRound ? `<span class="out-note">Out in round ${p.eliminatedInRound}</span>` : '<span class="out-note">Out</span>'}
      </div>
    `).join('');

    return `
      <div>
        <div class="players-head">
          <h2>Players</h2>
          <span class="count">${stillIn.length} in · ${out.length} out</span>
        </div>
        <div class="roster" style="margin-top:12px;">${rows}</div>
        ${out.length > 0 ? `<div class="out-divider"><span class="lbl">OUT</span><div class="line"></div></div><div class="roster" style="margin-top:8px;">${outRows}</div>` : ''}
      </div>
    `;
  }

  // played/alive, not played/totalPlayers - identical in round 1 (no one
  // eliminated yet), but alive is the actually-correct denominator once
  // a later round has fewer players left to take a shot.
  function progressHtml(played, alive) {
    if (!alive) return '';
    const pct = Math.min(100, Math.round((played / alive) * 100));
    return `
      <div class="progress-row">
        <div class="progress-label">
          <span class="lbl">ROUND PROGRESS</span>
          <span class="val"><b>${played}</b> / ${alive} shots</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }

  function sponsorBannerHtml(state) {
    if (!state.sponsorPromoActive || (!state.sponsorPromoImage && !state.sponsorPromoHeadline)) return '';
    const label = 'SPONSORED' + (state.venueName ? ' · ' + escapeHtml(state.venueName.toUpperCase()) : '');
    const img = state.sponsorPromoImage ? `<img class="sponsor__img" src="${state.sponsorPromoImage}" alt="">` : '';
    let headline = '';
    if (state.sponsorPromoHeadline && state.sponsorPromoImage) {
      headline = `<p class="sponsor__headline">${escapeHtml(state.sponsorPromoHeadline)}</p>`;
    } else if (state.sponsorPromoHeadline) {
      headline = `
        <div class="sponsor__headline-only">
          <span class="sponsor__tag"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M2 1a1 1 0 0 0-1 1v4.586a1 1 0 0 0 .293.707l7 7a1 1 0 0 0 1.414 0l4.586-4.586a1 1 0 0 0 0-1.414l-7-7A1 1 0 0 0 6.586 1zm4 3.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/></svg></span>
          <span class="sponsor__headline">${escapeHtml(state.sponsorPromoHeadline)}</span>
        </div>`;
    }
    return `
      <aside class="sponsor" aria-label="Sponsored by ${escapeHtml(state.venueName || 'this venue')}">
        <div class="sponsor__top"><span class="sponsor__ad">AD</span><span class="sponsor__label">${label}</span></div>
        ${img}
        ${headline}
      </aside>
    `;
  }

  function renderGame(state) {
    // Same shape the app sends to the Chromecast receiver (see
    // Cast.sendGame in KillerPool.jsx / updateGameLiveState in
    // src/firebase.js): { round, currentPlayerName, lives, defaultLives,
    // aliveCount, totalPlayers, playedThisRoundCount, players,
    // showTurnOrder }
    const total = Math.max(state.defaultLives || 3, state.lives || 0);
    const pips = Array.from({ length: total }, (_, i) =>
      `<span class="pip ${i < state.lives ? '' : 'off'}"></span>`
    ).join('');
    // UP NOW always shows - who's shooting right now is happening live,
    // not a strategic leak. "Public turn info" (showTurnOrder) only
    // controls whether the roster BELOW reveals the upcoming turn
    // sequence (turn order) or hides it (alphabetical) - see
    // renderPlayers.
    const turnInfo = `
      <span class="up-now-label">UP NOW</span>
      ${avatarHtml({ name: state.currentPlayerName, avatarPhoto: state.currentPlayerAvatar, avatarColor: state.currentPlayerAvatarColor }, 72)}
      <div class="player-name">${escapeHtml(state.currentPlayerName || '')}</div>
      <div class="pips">${pips}</div>
    `;
    const segTotal = Math.max(state.totalPlayers ?? 0, 1);
    const segs = Array.from({ length: segTotal }, (_, i) =>
      `<span class="seg ${i < (state.aliveCount ?? 0) ? '' : 'off'}"></span>`
    ).join('');

    stage.innerHTML = `
      <div class="ticket">
        <div class="ticket-top felt">
          <div class="round-badge"><span class="lbl">ROUND</span><span class="num">${state.round ?? 1}</span></div>
          ${turnInfo}
        </div>
        <div class="perf"><div class="perf-line"></div><span class="perf-hole l"></span><span class="perf-hole r"></span></div>
        <div class="ticket-stub">
          ${progressHtml(state.playedThisRoundCount ?? 0, state.aliveCount ?? 0)}
          <div class="hairline"></div>
          <div class="remaining-row">
            <div class="txt"><b>${state.aliveCount ?? '–'}</b> of <b>${state.totalPlayers ?? '–'}</b> players remaining</div>
            <div class="seg-track">${segs}</div>
          </div>
        </div>
      </div>
      ${sponsorBannerHtml(state)}
      ${renderPlayers(state.players, state.currentPlayerName, state.showTurnOrder)}
    `;
  }

  // Winner state kept as its own simpler layout (not the ticket pattern) -
  // explicit decision, not restyled to match renderGame's hero.
  function renderWinner(state) {
    stage.innerHTML = `
      <div class="centered-msg" style="min-height:auto;padding:20px 0;">
        <div class="pool-ball">8</div>
        <div class="winner-title">${escapeHtml(state.winnerName || 'SOMEONE')} WINS</div>
        <div class="winner-sub">Game over — round ${state.round ?? 1}</div>
      </div>
      ${sponsorBannerHtml(state)}
      ${renderPlayers(state.players, null, false)}
    `;
  }

  // Live-status indicator: this page updates itself via a Firestore
  // realtime listener, no manual refresh needed in normal use - but
  // mobile browsers commonly suspend a backgrounded/locked-screen tab's
  // network activity, and the listener can take a moment to reconnect
  // once it's foregrounded again. Rather than leave a viewer guessing
  // "is this frozen or just quiet," track when the last update actually
  // landed and show it - the pill itself is a manual refresh (a full
  // page reload, guaranteed to force a fresh connection) as a safety net.
  const livePill = document.getElementById('livePill');
  const liveDot = document.getElementById('liveDot');
  const liveText = document.getElementById('liveText');
  let lastUpdate = null;
  function markUpdated() {
    lastUpdate = Date.now();
    livePill.hidden = false;
  }
  function tickLiveStatus() {
    if (!lastUpdate) return;
    const secs = Math.round((Date.now() - lastUpdate) / 1000);
    const stale = secs > 25;
    liveDot.classList.toggle('stale', stale);
    if (secs < 5) liveText.textContent = 'Updated just now';
    else if (secs < 60) liveText.textContent = `Updated ${secs}s ago`;
    else liveText.textContent = `Updated ${Math.round(secs / 60)}m ago${stale ? ' — try refresh' : ''}`;
    livePill.setAttribute('aria-label', `Refresh, ${liveText.textContent.toLowerCase()}`);
  }
  setInterval(tickLiveStatus, 1000);
  // Re-check promptly when the tab comes back to the foreground, rather
  // than waiting up to a full second for the next tick to reveal a stale
  // connection - this is the exact moment a suspended listener would
  // need noticing.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tickLiveStatus(); });

  const params = new URLSearchParams(location.search);
  const gameId = params.get('game');

  if (!gameId) {
    renderMessage('NO GAME LINKED', 'This link is missing a game id — ask the organiser to re-share it.');
  } else {
    onSnapshot(
      doc(db, 'games', gameId),
      (snap) => {
        markUpdated();
        if (!snap.exists()) {
          renderMessage('GAME NOT FOUND', "This game doesn't exist or has ended.");
          return;
        }
        const state = snap.data();
        if (state.gameOver) {
          renderWinner(state);
          return;
        }
        // Confirmation Shot: the lone survivor missed their own
        // confirmation shot too, so nobody won this round. Checked
        // before the generic "no current player" fallback below, which
        // would otherwise show the misleading "WAITING FOR THE FIRST
        // SHOT" message for what's actually a round that already ended
        // unconfirmed, not a game that hasn't started yet.
        if (state.roundUnconfirmed) {
          renderMessage('NO ONE CONFIRMED THE WIN', 'The host is setting up the next round');
          return;
        }
        if (!state.currentPlayerName) {
          renderMessage('WAITING FOR THE FIRST SHOT…', '');
          return;
        }
        renderGame(state);
      },
      (err) => {
        console.error('Live game listener failed', err);
        renderMessage('CONNECTION LOST', "Couldn't reach the game — check your connection and reopen this link.");
      }
    );
  }
</script>
</body>
</html>
