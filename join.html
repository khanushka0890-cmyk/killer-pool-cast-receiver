<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Killer Pool — Follow Along</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; min-height: 100%;
    background: #0c1117;
    color: #e8edf2;
    /* Matches the app's own switch away from Barlow - Helvetica Neue is a
       system font on iOS/macOS (no download), standard fallback elsewhere. */
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .stage {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 8vh 8vw;
  }
  /* Purple/gold rebrand (was the neon-lime #D0F30D family) - colors
     matched to the app's actual current CSS, not just a hex swap: the
     round-badge pill is the app's real neutral navy pill (round-badge
     class in KillerPool.jsx), "UP NOW"/idle-title use the gold hand-fixed
     for the hero card specifically (not the generic darker gold-shade
     used elsewhere), and .pip.on mirrors LifePips' non-dark fill/border. */
  .round-badge {
    font-size: 14px;
    letter-spacing: 3px;
    color: #546e7a;
    font-weight: 700;
    background: #1a2535;
    border: 1px solid #1e2d40;
    border-radius: 100px;
    padding: 6px 16px;
    margin-bottom: 24px;
  }
  .round-badge b { color: #D99E38; }
  .up-now-label {
    font-size: 13px;
    letter-spacing: 3px;
    color: #D99E38;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .player-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 16vw, 96px);
    letter-spacing: 3px;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 60px rgba(217,158,56,0.25);
    margin-bottom: 20px;
    word-break: break-word;
  }
  .pips { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .pip {
    width: 20px; height: 20px; border-radius: 50%;
    background: #1e2530; border: 2px solid #3a4250;
  }
  .pip.on { background: #D99E38; border-color: #CB8F27; }
  .status-line {
    font-size: 15px;
    color: #78909c;
    margin-top: 12px;
  }
  .status-line b { color: #e8edf2; }
  .idle-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 10vw, 56px);
    letter-spacing: 4px;
    color: #D99E38;
  }
  .idle-sub {
    font-size: 14px;
    letter-spacing: 2px;
    color: #909AAC;
    margin-top: 16px;
    max-width: 320px;
  }
  .pool-ball {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a3a3a, #0a0a0a 70%);
    border: 1.5px solid #D99E38;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: #fff;
    margin-bottom: 20px;
  }
  .footer-note {
    position: fixed; bottom: 16px; left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    color: #2a3545;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="pool-ball">8</div>
    <div class="idle-title">CONNECTING…</div>
  </div>
  <div class="footer-note">KILLER POOL — LIVE SPECTATOR VIEW</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  // Same public config as the app itself (src/firebase.js) - safe to
  // ship here for the same reason it's safe in the app bundle: access is
  // restricted by Firestore security rules, not by keeping this object
  // secret. This page only ever reads (games/{gameId} is open-read for
  // anyone who knows the id - see firestore.rules) - never writes.
  const firebaseConfig = {
    apiKey: "AIzaSyCIJ452REbkJht4QlJwuP3kt8zS6OqdAPs",
    authDomain: "killer-pool-app.firebaseapp.com",
    projectId: "killer-pool-app",
    storageBucket: "killer-pool-app.firebasestorage.app",
    messagingSenderId: "149372024371",
    appId: "1:149372024371:web:cdab410678e1f4c6845546",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const stage = document.getElementById('stage');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function renderMessage(title, sub) {
    stage.innerHTML = `
      <div class="pool-ball">8</div>
      <div class="idle-title">${escapeHtml(title)}</div>
      <div class="idle-sub">${escapeHtml(sub || '')}</div>
    `;
  }

  function renderGame(state) {
    // Same shape the app sends to the Chromecast receiver (see
    // Cast.sendGame in KillerPool.jsx / updateGameLiveState in
    // src/firebase.js): { round, currentPlayerName, lives, defaultLives,
    // aliveCount, totalPlayers }
    const total = Math.max(state.defaultLives || 3, state.lives || 0);
    const pips = Array.from({ length: total }, (_, i) =>
      `<div class="pip ${i < state.lives ? 'on' : ''}"></div>`
    ).join('');
    stage.innerHTML = `
      <div class="round-badge">ROUND <b>${state.round ?? 1}</b></div>
      <div class="up-now-label">UP NOW</div>
      <div class="player-name">${escapeHtml(state.currentPlayerName || '')}</div>
      <div class="pips">${pips}</div>
      <div class="status-line"><b>${state.aliveCount ?? '–'}</b> of <b>${state.totalPlayers ?? '–'}</b> players remaining</div>
    `;
  }

  const params = new URLSearchParams(location.search);
  const gameId = params.get('game');

  if (!gameId) {
    renderMessage('NO GAME LINKED', 'This link is missing a game id — ask the organiser to re-share it.');
  } else {
    onSnapshot(
      doc(db, 'games', gameId),
      (snap) => {
        if (!snap.exists()) {
          renderMessage('GAME NOT FOUND', "This game doesn't exist or has ended.");
          return;
        }
        const state = snap.data();
        if (!state.currentPlayerName) {
          renderMessage('WAITING FOR THE FIRST SHOT…', '');
          return;
        }
        renderGame(state);
      },
      (err) => {
        console.error('Live game listener failed', err);
        renderMessage('CONNECTION LOST', "Couldn't reach the game — check your connection and reopen this link.");
      }
    );
  }
</script>
</body>
</html>
