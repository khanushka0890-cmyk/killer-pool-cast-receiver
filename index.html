<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Killer Pool — Cast Receiver</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    color: #e8edf2;
    font-family: 'Barlow', sans-serif;
    overflow: hidden;
    /* Same felt weave used on the app's own hero card - a flat #0c1117
       fill left the wide dead space between the two game-state columns
       reading as empty/broken rather than as deliberate breathing room. */
    background-color: #0c1117;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.16) 0 1px, transparent 1px 6px);
  }
  /* Real landscape layout, not a portrait column centered on a wide
     screen. Was a single flex-column stack (badge, label, name, pips,
     status all centered) sized in vw - technically fills a landscape
     viewport, but a lone centered column of text doesn't span the WIDTH
     of a 16:9 screen on its own, so the actual content read as a narrow
     vertical strip with huge empty gutters left/right - exactly what
     "vertical on a horizontal screen" looks like, even though nothing
     was literally rotated. Fixed by actually using the width: identity
     (round + up now + name) on the left, stats (pips + remaining) on
     the right, both vertically centered, one row. */
  .stage {
    width: 100vw; height: 100vh;
    padding: 4vh 6vw;
  }
  .stage.idle {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  /* v2: the grid-of-text alone (previous fix) technically spanned the
     width correctly, but read as a handful of small labels floating in a
     huge dark void - no persistent identity once a game starts (only the
     idle screen had the "KILLER POOL" wordmark), and capping the grid's
     width to avoid a dead gap between columns just moved that same dead
     space to the screen's edges instead. Framing everything inside one
     large bordered card - the same gold-rimmed treatment the app's own
     hero card uses - fixes both at once: the CARD is sized to be a real
     presence on the screen (not just its text), and a permanent brand
     row up top means the screen never looks unbranded once play starts. */
  .stage.game {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  .game-card {
    width: min(1500px, 90vw);
    background: linear-gradient(160deg, #171f2c 0%, #0d1219 100%);
    border: 2px solid rgba(255, 215, 0, 0.3);
    border-radius: 28px;
    box-shadow:
      0 0 0 1px rgba(255, 215, 0, 0.07) inset,
      0 40px 100px rgba(0, 0, 0, 0.55);
    padding: 5vh 5vw;
  }
  /* space-between, not the plain left-aligned row this was - the round
     badge used to sit above "UP NOW" in the left column, floating in
     the middle of the card on its own. Moving it up here, right-aligned
     and vertically centered with the brand mark, gives it a fixed home
     (top-right, like a broadcast graphic's corner bug) instead of
     competing with the player name for the same block of space. */
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4vh;
    padding-bottom: 3vh;
    border-bottom: 1px solid #23303f;
  }
  .brand-left { display: flex; align-items: center; gap: 1vw; }
  .brand-row .pool-ball { width: 5vh; height: 5vh; font-size: 1.9vh; margin-bottom: 0; }
  .brand-word {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4vh;
    letter-spacing: 0.35vw;
    color: #FFD700;
  }
  .brand-word span { color: #55606e; letter-spacing: 0.2vw; }
  /* auto columns + justify-content:center, not fr columns - fr stretches
     each column to a fixed fraction of the card's full width regardless
     of what's actually inside it, which just relocated the old dead-gap
     problem from "around the card" to "inside the right half of it".
     auto columns size to their own content and justify-content centers
     the pair as a unit, so the card's extra width becomes even breathing
     room on both sides instead of a lopsided empty quadrant. */
  .game-grid {
    display: grid;
    grid-template-columns: auto auto;
    column-gap: 6vw;
    justify-content: center;
    align-items: center;
  }
  .left-col { min-width: 0; text-align: left; }
  .right-col { min-width: 0; text-align: left; padding-left: 4vw; border-left: 2px solid #1e2d40; height: fit-content; }
  /* Avatar sits beside the "UP NOW" / name stack, not above or below it -
     same identity-row shape the app's own hero card uses. */
  .identity-row { display: flex; align-items: center; gap: 2vw; }
  .avatar {
    flex-shrink: 0;
    border-radius: 50%;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    color: #fff;
    background: #546e7a;
    border: 3px solid rgba(255, 215, 0, 0.5);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.game-avatar { width: 11vh; height: 11vh; font-size: 4vh; }
  .round-badge {
    display: inline-block;
    font-size: 1.7vw;
    letter-spacing: 0.3vw;
    color: #7a6010;
    font-weight: 700;
    background: #1a1508;
    border: 1px solid #3a2e0f;
    border-radius: 100px;
    padding: 0.8vh 1.6vw;
  }
  .up-now-label {
    font-size: 1.5vw;
    letter-spacing: 0.4vw;
    color: #7a6010;
    font-weight: 700;
    margin-bottom: 1vh;
  }
  .player-name {
    font-family: 'Bebas Neue', sans-serif;
    /* vh, not vw, for the dimension actually in short supply on a
       landscape screen - vw made this scale with the WIDE axis, which
       is exactly backwards for a screen that's short and wide. */
    font-size: 13vh;
    letter-spacing: 0.3vw;
    line-height: 1;
    color: #FFD700;
    text-shadow: 0 0 60px rgba(255,215,0,0.25);
    /* A name long enough to not fit in one line at 13vh used to hard-wrap
       mid-word ("CHRISTOP / HER") - renderGame now grades the font size
       down by name length instead, so a long name shrinks to fit on one
       line rather than getting torn in half. */
    white-space: nowrap;
  }
  .player-name.len-long { font-size: 8.5vh; }
  .player-name.len-verylong { font-size: 6.2vh; }
  .stat-label {
    font-size: 1.4vw;
    letter-spacing: 0.3vw;
    color: #78909c;
    font-weight: 700;
    margin-bottom: 2vh;
  }
  .pips { display: flex; gap: 1.1vw; flex-wrap: wrap; margin-bottom: 3.5vh; }
  .pip {
    width: 3.2vw; height: 3.2vw; border-radius: 50%;
    background: #1e2530; border: 3px solid #3a4250;
  }
  .pip.on { background: #FFD700; border-color: #b8942a; }
  .status-line {
    font-size: 1.6vw;
    color: #78909c;
  }
  .status-line b { color: #e8edf2; font-size: 2vw; }
  /* Winner screen - reuses the same card/brand-row shell as the game
     state (so it doesn't feel like a different app), single centered
     column instead of the two-column layout since there's only one
     thing left to announce. */
  .stage.winner {
    display: flex; align-items: center; justify-content: center;
    height: 100%;
  }
  .winner-card { width: min(900px, 72vw); }
  .winner-content { text-align: center; padding-top: 1vh; }
  .winner-label {
    font-size: 1.8vh;
    letter-spacing: 0.5vw;
    color: #7a6010;
    font-weight: 700;
    margin-bottom: 3vh;
  }
  .avatar.winner-avatar {
    width: 20vh; height: 20vh; font-size: 7vh;
    margin: 0 auto 3.5vh;
    border-width: 4px;
    box-shadow: 0 0 60px rgba(255, 215, 0, 0.3);
  }
  .winner-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11vh;
    line-height: 1;
    color: #FFD700;
    text-shadow: 0 0 80px rgba(255, 215, 0, 0.35);
    word-break: break-word;
  }
  .winner-sub {
    margin-top: 2.5vh;
    font-size: 1.6vh;
    letter-spacing: 0.3vw;
    color: #78909c;
    font-weight: 700;
  }
  .idle-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 7vw;
    letter-spacing: 0.5vw;
    color: #FFD700;
  }
  .idle-sub {
    font-size: 1.4vw;
    letter-spacing: 0.3vw;
    color: #4a5568;
    margin-top: 2vh;
  }
  .pool-ball {
    width: 7vh; height: 7vh;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a3a3a, #0a0a0a 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.6vh;
    color: #fff;
    margin-bottom: 3vh;
  }
  .idle .pool-ball { margin-left: auto; margin-right: auto; }
</style>
</head>
<body>
  <div class="stage idle" id="stage">
    <div class="pool-ball">8</div>
    <div class="idle-title">KILLER POOL</div>
    <div class="idle-sub">WAITING FOR ORGANISER TO START A GAME…</div>
  </div>

<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
  // Custom message namespace the phone app (sender) publishes state on.
  // Must match CAST_NAMESPACE in the app's Chromecast integration.
  const NAMESPACE = 'urn:x-cast:com.killerpool.state';
  const stage = document.getElementById('stage');

  function renderIdle() {
    stage.className = 'stage idle';
    stage.innerHTML = `
      <div class="pool-ball">8</div>
      <div class="idle-title">KILLER POOL</div>
      <div class="idle-sub">WAITING FOR ORGANISER TO START A GAME…</div>
    `;
  }

  function renderGame(state) {
    // Expected shape (kept intentionally small — see capacitorSetup.js):
    // { round, currentPlayerName, lives, defaultLives, aliveCount,
    //   totalPlayers, currentPlayerAvatar, currentPlayerAvatarColor }
    // currentPlayerAvatar is a data: URL (or absent) - see
    // resizeImageToDataUrl in KillerPool.jsx, already resized small
    // before it ever leaves the phone.
    stage.className = 'stage game';
    const total = Math.max(state.defaultLives || 3, state.lives || 0);
    const pips = Array.from({ length: total }, (_, i) =>
      `<div class="pip ${i < state.lives ? 'on' : ''}"></div>`
    ).join('');
    const name = state.currentPlayerName ?? '';
    const nameClass = name.length > 14 ? 'len-verylong' : name.length > 9 ? 'len-long' : '';
    stage.innerHTML = `
      <div class="game-card">
        <div class="brand-row">
          <div class="brand-left">
            <div class="pool-ball">8</div>
            <div class="brand-word">KILLER POOL <span>— LIVE</span></div>
          </div>
          <div class="round-badge">ROUND ${state.round ?? 1}</div>
        </div>
        <div class="game-grid">
          <div class="left-col">
            <div class="identity-row">
              ${avatarHtml(state.currentPlayerAvatar, state.currentPlayerAvatarColor, name, 'game-avatar')}
              <div>
                <div class="up-now-label">UP NOW</div>
                <div class="player-name ${nameClass}">${escapeHtml(name)}</div>
              </div>
            </div>
          </div>
          <div class="right-col">
            <div class="stat-label">LIVES</div>
            <div class="pips">${pips}</div>
            <div class="status-line"><b>${state.aliveCount ?? '–'}</b> of <b>${state.totalPlayers ?? '–'}</b><br/>players remaining</div>
          </div>
        </div>
      </div>
    `;
  }

  function renderWinner(state) {
    // { winnerName, winnerAvatar, winnerAvatarColor }
    stage.className = 'stage winner';
    const name = state.winnerName ?? '';
    stage.innerHTML = `
      <div class="game-card winner-card">
        <div class="brand-row">
          <div class="brand-left">
            <div class="pool-ball">8</div>
            <div class="brand-word">KILLER POOL <span>— LIVE</span></div>
          </div>
        </div>
        <div class="winner-content">
          <div class="winner-label">WINNER</div>
          ${avatarHtml(state.winnerAvatar, state.winnerAvatarColor, name, 'winner-avatar')}
          <div class="winner-name">${escapeHtml(name)}</div>
          <div class="winner-sub">LAST ONE STANDING</div>
        </div>
      </div>
    `;
  }

  // Shared between the game and winner screens - a real photo if the
  // player set one (already a small resized data: URL by the time it
  // gets here), otherwise the same colored-circle-plus-initial fallback
  // the app itself uses when there's no photo.
  function avatarHtml(photoUrl, color, name, sizeClass) {
    const initial = escapeHtml((name || '').trim().charAt(0).toUpperCase() || '?');
    if (photoUrl) {
      return `<div class="avatar ${sizeClass}"><img src="${photoUrl}" alt="" /></div>`;
    }
    return `<div class="avatar ${sizeClass}" style="background:${color || '#546e7a'}">${initial}</div>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  // Guarded: this file is previewed in a plain browser during development
  // (no `cast` global there), and only actually runs inside the Cast SDK
  // runtime when loaded on a real Chromecast device.
  if (typeof cast !== 'undefined' && cast.framework) {
    const context = cast.framework.CastReceiverContext.getInstance();

    context.addCustomMessageListener(NAMESPACE, (event) => {
      const data = event.data;
      if (!data || data.type === 'idle') { renderIdle(); return; }
      if (data.type === 'game') { renderGame(data); return; }
      if (data.type === 'winner') { renderWinner(data); return; }
    });

    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true; // keep the receiver alive between rounds
    context.start(options);
  } else {
    console.warn('Cast SDK not available — showing idle state (expected in a plain browser preview).');
  }
</script>
</body>
</html>
