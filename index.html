<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Killer Pool — Cast Receiver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* 1 design px. Stage is designed at 1280x720 and scales to fit any
       screen while keeping 16:9 - letterboxes (never stretches/crops) on
       a non-16:9 receiver viewport. See killer-pool-tv-cast-screen-handoff.md */
    --u: min(calc(100vw / 1280), calc(100vh / 720));
    --bg:#0B0A12; --felt:#2D1A55; --stub:#1E1238; --deep:#1A1030;
    --gold:#F2B84B; --gold-text:#F5C76A; --ivory:#F7EEDC;
    --text:#FFFFFF; --text-2:#CBC2E0; --line:#4A4463;
    --live:#F0625A; --live-text:#FF8A83;
    --next:#B79CF0; --next-edge:rgba(183,156,240,.45);
    --edge:rgba(242,184,75,.55);
    --muted:#A9A3BC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
  body { font-family: 'Barlow', system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }

  .tv-stage { position: fixed; inset: 0; margin: auto;
    width: calc(1280 * var(--u)); height: calc(720 * var(--u));
    background: radial-gradient(ellipse at 50% 40%, var(--deep) 0%, var(--bg) 70%); }

  /* Felt texture - fixed-px weave, deliberately NOT scaled with --u so it
     stays a fine weave instead of a blown-up pattern on big/4K screens. */
  .felt { background-color: var(--felt);
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.024) 0 1px, transparent 1px 4px),
                       repeating-linear-gradient(-45deg, rgba(0,0,0,.09) 0 1px, transparent 1px 4px); }

  /* Idle */
  .tv-idle { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: calc(20 * var(--u)); text-align: center; }
  .tv-idle__ball { width: calc(84 * var(--u)); height: calc(84 * var(--u)); }
  .tv-idle__title { font: 400 calc(52 * var(--u))/1 'Bebas Neue', sans-serif; letter-spacing: calc(4 * var(--u)); color: var(--gold); }
  .tv-idle__sub { font: 600 calc(17 * var(--u))/1 'Barlow Condensed', sans-serif; letter-spacing: calc(3 * var(--u)); color: var(--text-2); }

  /* Ticket: felt | perforation | stub, inside the 5% title-safe area. Used
     for the live screen AND, per UPDATE 3, the winner/no-winner screens -
     same shell, different content inside, so the game never jumps to a
     visually different "app" the instant it ends. */
  .tv-ticket { position: absolute; left: calc(80 * var(--u)); top: calc(88 * var(--u));
    width: calc(1120 * var(--u)); height: calc(544 * var(--u)); display: flex;
    filter: drop-shadow(0 calc(30 * var(--u)) calc(60 * var(--u)) rgba(0,0,0,.5)); }
  /* Next-up pill grows the ticket by 48 design px (top 88->64, height 544->592) -
     still inside the 36px title-safe margin. See tv-cast-screen-update-2.md */
  .tv-ticket.has-next { top: calc(64 * var(--u)); height: calc(592 * var(--u)); }

  /* UPDATE 3 spacing/type pass: felt padding is now asymmetric (tighter
     right, to leave more room before the perforation), 8-ball grew
     44->49, round chip's side padding tightened 22->16. */
  .tv-main { flex: 1 1 auto; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column;
    border: 1px solid var(--edge); border-right: none; border-radius: calc(28 * var(--u)) 0 0 calc(28 * var(--u));
    padding: calc(44 * var(--u)) calc(36 * var(--u)) calc(44 * var(--u)) calc(44 * var(--u)); }

  .tv-head { display: flex; align-items: center; justify-content: space-between; height: calc(52 * var(--u)); }
  .tv-brand { display: flex; align-items: center; gap: calc(14 * var(--u)); }
  .tv-brand__ball { width: calc(49 * var(--u)); height: calc(49 * var(--u)); flex-shrink: 0; }
  .tv-brand__lockup { display: flex; flex-direction: column; gap: calc(2 * var(--u)); }
  .tv-brand__name { font: 400 calc(30 * var(--u))/1 'Bebas Neue', sans-serif; letter-spacing: calc(3 * var(--u)); color: var(--gold); }
  .tv-brand__sub { font: 600 calc(15 * var(--u))/1.1 'Barlow Condensed', sans-serif; letter-spacing: calc(6.6 * var(--u)); color: var(--text-2); }
  .tv-live { display: inline-flex; align-items: center; gap: calc(8 * var(--u)); height: calc(32 * var(--u));
    padding: 0 calc(14 * var(--u)) 0 calc(12 * var(--u)); border-radius: calc(16 * var(--u)); background: rgba(240,98,90,.14);
    font: 700 calc(16 * var(--u))/1 'Barlow Condensed', sans-serif; letter-spacing: calc(2 * var(--u)); color: var(--live-text);
    margin-left: calc(14 * var(--u)); }
  .tv-live::before { content: ""; width: calc(9 * var(--u)); height: calc(9 * var(--u)); border-radius: 50%; background: var(--live); }
  .tv-round { display: flex; align-items: center; gap: calc(12 * var(--u)); height: calc(52 * var(--u)); box-sizing: border-box;
    padding: 0 calc(16 * var(--u)); border-radius: calc(14 * var(--u)); background: rgba(11,10,18,.45); border: 1px solid rgba(242,184,75,.35); }
  .tv-round__lbl { font: 600 calc(18 * var(--u))/1 'Barlow Condensed', sans-serif; letter-spacing: calc(3 * var(--u)); padding-left: calc(3 * var(--u)); color: var(--text-2); }
  .tv-round__num { font: 400 calc(40 * var(--u))/1 'Bebas Neue', sans-serif; color: var(--gold); padding-top: calc(4 * var(--u)); }

  /* Hero - UPDATE 3: UP NOW + name are their own group (.tv-hero__id);
     lives is now a SIBLING of that group, not nested inside it, so
     inserting the next-up pill below never disturbs the vertical
     centring of UP NOW/name/lives against the avatar (.tv-hero itself
     stays align-items:center with exactly two children: avatar + text
     column). */
  .tv-hero { flex: 1 1 auto; display: flex; align-items: center; gap: calc(40 * var(--u)); min-height: 0; }
  .tv-avatar { width: calc(168 * var(--u)); height: calc(168 * var(--u)); flex-shrink: 0; box-sizing: border-box; border-radius: 50%;
    padding: calc(5 * var(--u)); background: var(--gold); }
  .tv-avatar__inner { width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%; border: calc(5 * var(--u)) solid var(--felt);
    display: flex; align-items: center; justify-content: center; font: 400 calc(80 * var(--u))/1 'Bebas Neue', sans-serif;
    color: #fff; padding-top: calc(6 * var(--u)); overflow: hidden; }
  .tv-avatar__inner img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
  .tv-hero__text { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  .tv-hero__id { display: flex; flex-direction: column; gap: calc(6 * var(--u)); min-width: 0; }
  .tv-upnow { font: 700 calc(22 * var(--u))/1 'Barlow Condensed', sans-serif; letter-spacing: calc(6 * var(--u)); color: var(--gold-text); }
  /* 150/128 -> 96/0.7 - a smaller name, closer line-height, per the
     UPDATE 3 spacing/type pass. */
  .tv-name { font: 400 calc(96 * var(--u))/0.7 'Bebas Neue', sans-serif; letter-spacing: calc(3 * var(--u));
    color: var(--text); padding-top: calc(10 * var(--u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* margin-top:6 (nested in the id group) -> padding-top:16 (sibling of it) */
  .tv-lives { display: flex; align-items: center; gap: calc(12 * var(--u)); padding-top: calc(16 * var(--u)); flex-wrap: wrap; }
  .tv-pip { width: calc(30 * var(--u)); height: calc(30 * var(--u)); box-sizing: border-box; border-radius: 50%; border: calc(2 * var(--u)) solid var(--line); flex-shrink: 0; }
  .tv-pip.is-on { border: none; background: var(--gold);
    box-shadow: inset calc(-3 * var(--u)) calc(-3 * var(--u)) 0 rgba(0,0,0,.22), inset calc(2 * var(--u)) calc(2 * var(--u)) 0 rgba(255,255,255,.35); }
  .tv-pip.is-last { background: var(--live); box-shadow: inset calc(-3 * var(--u)) calc(-3 * var(--u)) 0 rgba(0,0,0,.22), inset calc(2 * var(--u)) calc(2 * var(--u)) 0 rgba(255,255,255,.35); }
  .tv-lives__txt { font: 500 calc(22 * var(--u))/1 'Barlow', sans-serif; color: var(--text-2); margin-left: calc(6 * var(--u)); }
  .tv-lives__txt.is-last { color: var(--live-text); }

  /* Next-up pill - UPDATE 3: moved OUT of the hero, now a sibling of
     .tv-hero between it and .tv-stats, so it never affects the hero's
     own centring. align-self:flex-start lines its left edge up with the
     felt panel's own left padding (the avatar's left edge), not with the
     name. Lilac, not gold - gold is reserved for the current shooter. */
  .tv-next { align-self: flex-start; display: flex; align-items: center; gap: calc(12 * var(--u)); margin: calc(4 * var(--u)) 0 calc(22 * var(--u));
    height: calc(52 * var(--u)); box-sizing: border-box; padding: 0 calc(22 * var(--u)) 0 calc(8 * var(--u)); border-radius: calc(26 * var(--u));
    background: rgba(11,10,18,.45); border: 1px solid var(--next-edge); }
  .tv-next__av { width: calc(38 * var(--u)); height: calc(38 * var(--u)); flex-shrink: 0; box-sizing: border-box; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font: 400 calc(20 * var(--u))/1 'Bebas Neue', sans-serif; color: #fff; padding-top: calc(2 * var(--u)); }
  .tv-next__av img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
  .tv-next__lbl { font: 700 calc(17 * var(--u))/1 'Barlow Condensed', sans-serif; letter-spacing: calc(3 * var(--u)); color: var(--next); }
  .tv-next__name { font: 700 calc(24 * var(--u))/1 'Barlow', sans-serif; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(320 * var(--u)); }

  .tv-stats { display: grid; grid-template-columns: 1fr 1fr; gap: calc(48 * var(--u)); padding-top: calc(28 * var(--u)); border-top: 1px solid rgba(255,255,255,.1); }
  .tv-stat { display: flex; flex-direction: column; gap: calc(12 * var(--u)); min-width: 0; }
  .tv-stat__row { display: flex; justify-content: space-between; align-items: baseline; }
  .tv-stat__lbl { font: 700 calc(17 * var(--u))/1 'Barlow Condensed', sans-serif; letter-spacing: calc(3 * var(--u)); color: var(--text-2); }
  .tv-stat__val { font: 400 calc(22 * var(--u))/1 'Barlow', sans-serif; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .tv-stat__val b { color: #fff; font-weight: 700; }
  .tv-bar { height: calc(8 * var(--u)); border-radius: calc(4 * var(--u)); background: rgba(255,255,255,.12); overflow: hidden; }
  .tv-bar__fill { height: 100%; border-radius: inherit; background: var(--gold); }
  .tv-segs { display: flex; gap: calc(6 * var(--u)); }
  .tv-seg { flex: 1; height: calc(8 * var(--u)); border-radius: calc(4 * var(--u)); background: rgba(255,255,255,.12); }
  .tv-seg.is-on { background: var(--gold); }

  /* Vertical perforation */
  .tv-perf { position: relative; width: calc(28 * var(--u)); flex-shrink: 0; box-sizing: border-box;
    border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
    background: linear-gradient(90deg, transparent 50%, var(--stub) 50%); }
  .tv-perf__felt { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; }
  .tv-perf__line { position: absolute; left: 50%; top: calc(36 * var(--u)); bottom: calc(36 * var(--u)); border-left: 2px dashed rgba(242,184,75,.4); transform: translateX(-1px); }
  .tv-perf__hole { position: absolute; left: 0; width: calc(28 * var(--u)); height: calc(28 * var(--u)); box-sizing: border-box; border-radius: 50%; background: var(--bg); }
  .tv-perf__hole--top { top: calc(-15 * var(--u)); border-bottom: 1px solid var(--edge); }
  .tv-perf__hole--bot { bottom: calc(-15 * var(--u)); border-top: 1px solid var(--edge); }

  /* Stub: prize pot (when there is one) + QR. UPDATE 3: padding tightens
     to fit both blocks, flat, no texture (per the "only two tones" rule). */
  .tv-stub { width: calc(300 * var(--u)); flex-shrink: 0; box-sizing: border-box; background: var(--stub);
    border: 1px solid var(--edge); border-left: none; border-radius: 0 calc(28 * var(--u)) calc(28 * var(--u)) 0;
    padding: calc(40 * var(--u)) calc(30 * var(--u));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(26 * var(--u)); }
  .tv-qr { padding: calc(16 * var(--u)); border-radius: calc(18 * var(--u)); background: var(--ivory); box-shadow: 0 0 0 1px rgba(242,184,75,.5); }
  .tv-qr svg { display: block; width: calc(184 * var(--u)); height: calc(184 * var(--u)); }
  .tv-qr__cap { font: 700 calc(17 * var(--u))/1 'Barlow Condensed', sans-serif; letter-spacing: calc(3 * var(--u)); padding-left: calc(3 * var(--u)); color: var(--gold-text); text-align: center; }

  /* Prize pot (stub). No currency unit anywhere - the app runs in
     different countries, so only the plain number (as the organizer
     typed it, comma-grouped for readability) is shown - same decision
     already shipped in the app's own Spectate screen. */
  .tv-prize { display: flex; flex-direction: column; align-items: center; gap: calc(6 * var(--u)); }
  .tv-prize__lbl { font: 700 calc(17 * var(--u))/1 'Barlow Condensed', sans-serif; letter-spacing: calc(3 * var(--u)); padding-left: calc(3 * var(--u)); color: var(--text-2); }
  .tv-prize__lbl.is-win { color: var(--gold-text); }
  .tv-prize__val { font: 400 calc(54 * var(--u))/1 'Bebas Neue', sans-serif; letter-spacing: calc(1 * var(--u)); color: var(--gold); padding-top: calc(4 * var(--u)); white-space: nowrap; }
  .tv-prize__val.is-void { color: var(--text-2); }
  .tv-prize__sub { font: 500 calc(16 * var(--u))/1 'Barlow', sans-serif; color: #8C86A3; text-align: center; }
  .tv-stub__rule { width: calc(72 * var(--u)); height: 1px; background: rgba(242,184,75,.3); }

  /* End-of-game screens (UPDATE 3) - reuse the same ticket/felt/perf/stub
     shell as the live screen, just with a different header flag, hero
     content and bottom strip, so ending a game doesn't jump to a
     visually different app. */
  .tv-flag { display: inline-flex; align-items: center; gap: calc(8 * var(--u)); height: calc(32 * var(--u));
    padding: 0 calc(14 * var(--u)); border-radius: calc(16 * var(--u));
    font: 700 calc(16 * var(--u))/1 'Barlow Condensed', sans-serif; letter-spacing: calc(2 * var(--u));
    margin-left: calc(14 * var(--u)); }
  .tv-flag--done { background: rgba(242,184,75,.16); color: var(--gold-text); }
  .tv-flag--void { background: rgba(255,255,255,.07); color: var(--muted); }

  /* Winner: crown + glow on the normal avatar ring. */
  .tv-avatar--win { position: relative; overflow: visible; box-shadow: 0 0 calc(40 * var(--u)) rgba(242,184,75,.35); }
  .tv-crown { width: calc(52 * var(--u)); height: calc(52 * var(--u)); position: absolute; z-index: 2; left: 50%; top: calc(-38 * var(--u)); transform: translateX(-50%);
    filter: drop-shadow(0 calc(3 * var(--u)) calc(6 * var(--u)) rgba(0,0,0,.45)); }

  /* No-winner: an empty dashed ring in place of a player avatar, same
     size/position as the real avatar so the screen doesn't jump between
     states. Grey 8-ball mark inside so it isn't mistaken for a live
     player circle. */
  .tv-avatar--void { background: none; border: calc(2 * var(--u)) dashed var(--line); display: flex; align-items: center; justify-content: center; }
  .tv-avatar--void svg { width: calc(92 * var(--u)); height: calc(92 * var(--u)); }

  .tv-winlbl { font: 700 calc(22 * var(--u))/1 'Barlow Condensed', sans-serif; letter-spacing: calc(6 * var(--u)); color: var(--gold-text); }
  .tv-winlbl--void { color: var(--muted); }
  .tv-name--void { color: var(--ivory); }
  .tv-sub { font: 500 calc(22 * var(--u))/1 'Barlow', sans-serif; color: var(--text-2); padding-top: calc(16 * var(--u)); }

  /* Bottom facts strip - same rhythm/shape as .tv-stats, which it
     replaces on both end-of-game screens. */
  .tv-facts { display: grid; grid-template-columns: 1fr 1fr; gap: calc(48 * var(--u)); padding-top: calc(28 * var(--u)); border-top: 1px solid rgba(255,255,255,.1); }
  .tv-fact { display: flex; flex-direction: column; gap: calc(10 * var(--u)); min-width: 0; }
  .tv-fact__lbl { font: 700 calc(17 * var(--u))/1 'Barlow Condensed', sans-serif; letter-spacing: calc(3 * var(--u)); color: var(--text-2); }
  .tv-fact__val { display: flex; align-items: center; gap: calc(10 * var(--u)); font: 700 calc(24 * var(--u))/1 'Barlow', sans-serif; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tv-fact__av { width: calc(30 * var(--u)); height: calc(30 * var(--u)); flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    overflow: hidden; font: 400 calc(16 * var(--u))/1 'Bebas Neue', sans-serif; color: #fff; padding-top: calc(2 * var(--u)); }
  .tv-fact__av img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
</style>
</head>
<body>
  <div class="tv-stage" id="stage">
    <div class="tv-idle">
      <svg class="tv-idle__ball" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#0B0A12" stroke="#4A4463" stroke-width="1"/><circle cx="13" cy="13" r="6" fill="#F4F1FA"/><text x="13" y="16.5" text-anchor="middle" font-family="Barlow, sans-serif" font-weight="700" font-size="9" fill="#0B0A12">8</text></svg>
      <div class="tv-idle__title">KILLER POOL</div>
      <div class="tv-idle__sub">WAITING FOR ORGANISER TO START A GAME…</div>
    </div>
  </div>

<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<!-- Same QR library (same pinned version) the app's own Share screen
     already uses (src/KillerPool.jsx) - a plain UMD build, exposes a
     global `qrcode` function, no build step needed for this static page. -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
<script>
  // Custom message namespace the phone app (sender) publishes state on.
  // Must match CAST_NAMESPACE in the app's Chromecast integration.
  const NAMESPACE = 'urn:x-cast:com.killerpool.state';
  const stage = document.getElementById('stage');
  const BRAND_BALL_SVG = '<svg class="tv-brand__ball" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#0B0A12" stroke="#4A4463" stroke-width="1"/><circle cx="13" cy="13" r="6" fill="#F4F1FA"/><text x="13" y="16.5" text-anchor="middle" font-family="Barlow, sans-serif" font-weight="700" font-size="9" fill="#0B0A12">8</text></svg>';
  // Same 8-ball mark, drawn grey - used for the no-winner screen's empty
  // avatar slot so it reads as "no one", not as a live player circle.
  const VOID_BALL_SVG = '<svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#0B0A12" stroke="#4A4463" stroke-width="1"/><circle cx="13" cy="13" r="6" fill="#8C86A3"/><text x="13" y="16.5" text-anchor="middle" font-family="Barlow, sans-serif" font-weight="700" font-size="9" fill="#0B0A12">8</text></svg>';
  const CROWN_SVG = '<svg class="tv-crown" viewBox="0 0 24 24" fill="#F2B84B" aria-hidden="true"><path d="M3 8.5l4.2 3.1L12 4l4.8 7.6L21 8.5l-1.6 9.2a1 1 0 0 1-1 .8H5.6a1 1 0 0 1-1-.8L3 8.5z"/></svg>';

  // Same join.html link + QR the organizer's own phone Share screen
  // offers (src/KillerPool.jsx's JOIN_PAGE_BASE_URL) - drawn here too so
  // anyone standing in front of the TV can scan it directly, not just the
  // organizer. Returns null when there's no gameId yet - a fresh game's
  // Firestore doc takes a couple seconds to be created (see
  // KillerPool.jsx's gameId-creation effect), so the very first state
  // message or two won't have one; the stub still renders, just without
  // the QR tile until one arrives.
  const JOIN_PAGE_BASE_URL = 'https://khanushka0890-cmyk.github.io/killer-pool-cast-receiver/join.html';
  function qrSvg(gameId) {
    if (!gameId || typeof qrcode !== 'function') return null;
    const joinUrl = `${JOIN_PAGE_BASE_URL}?game=${gameId}`;
    const qr = qrcode(0, 'M');
    qr.addData(joinUrl);
    qr.make();
    return qr.createSvgTag({ cellSize: 5, margin: 1 });
  }
  function qrBlockHtml(gameId, caption) {
    const svg = qrSvg(gameId);
    if (!svg) return '';
    return `<div class="tv-qr">${svg}</div><span class="tv-qr__cap">${caption}</span>`;
  }
  // Bare number, comma-grouped, no unit - the app runs in different
  // countries and never shows a currency (real product decision, see the
  // app's own Spectate screen and Plan a Game entry-fee field).
  function fmtPot(n) {
    return Math.round(n || 0).toLocaleString();
  }

  function renderIdle() {
    stage.className = 'tv-stage';
    stage.innerHTML = `
      <div class="tv-idle">
        ${BRAND_BALL_SVG.replace('tv-brand__ball', 'tv-idle__ball')}
        <div class="tv-idle__title">KILLER POOL</div>
        <div class="tv-idle__sub">WAITING FOR ORGANISER TO START A GAME…</div>
      </div>
    `;
  }

  // Real request: "a round progress line as a progress bar" - played/
  // alive, not played/totalPlayers, since alive is the correct
  // denominator once a later round has fewer players left to shoot.
  function roundProgressStat(played, alive) {
    const denom = alive || 0;
    const pct = denom ? Math.min(100, Math.round((played / denom) * 100)) : 0;
    return `
      <div class="tv-stat">
        <div class="tv-stat__row"><span class="tv-stat__lbl">ROUND PROGRESS</span><span class="tv-stat__val"><b>${played}</b> / ${denom} shots</span></div>
        <div class="tv-bar"><div class="tv-bar__fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }

  // Segmented bar up to 12 players (one segment per player, readable at TV
  // distance); above that, a continuous fill bar like round progress,
  // since 20+ segments get too thin to read. See the TV handoff, 5.3.
  function playersRemainingStat(alive, total) {
    let visual;
    if (total > 12) {
      const pct = total ? Math.min(100, Math.round((alive / total) * 100)) : 0;
      visual = `<div class="tv-bar"><div class="tv-bar__fill" style="width:${pct}%"></div></div>`;
    } else {
      const segs = Array.from({ length: total || 0 }, (_, i) => `<span class="tv-seg ${i < alive ? 'is-on' : ''}"></span>`).join('');
      visual = `<div class="tv-segs">${segs}</div>`;
    }
    return `
      <div class="tv-stat">
        <div class="tv-stat__row"><span class="tv-stat__lbl">PLAYERS REMAINING</span><span class="tv-stat__val"><b>${alive}</b> of ${total}</span></div>
        ${visual}
      </div>
    `;
  }

  // Same rule as the app's own RdPips (KillerPool.jsx): the single
  // remaining pip on the last life turns red, and the caption swaps to
  // "Last life".
  function livesHtml(lives, defaultLives) {
    const show = Math.max(lives, 0);
    const total = Math.max(defaultLives || 3, show);
    const isLast = show === 1;
    const pips = Array.from({ length: total }, (_, i) => {
      const filled = i < show;
      const lastPip = filled && isLast && i === show - 1;
      return `<span class="tv-pip ${filled ? 'is-on' : ''} ${lastPip ? 'is-last' : ''}"></span>`;
    }).join('');
    const label = isLast ? 'Last life' : `${show} lives left`;
    return `
      <div class="tv-lives" aria-label="${show} of ${total} lives left">
        ${pips}
        <span class="tv-lives__txt ${isLast ? 'is-last' : ''}">${label}</span>
      </div>
    `;
  }

  // Main "UP NOW"/winner avatar: gold ring + felt inner border, matching
  // the app's own hero card. Real photo when the player set one,
  // otherwise a colored-circle-plus-initial fallback. extraClass adds
  // the winner glow/crown wrapper without a separate function.
  function heroAvatarHtml(photoUrl, color, name, extraClass) {
    const initial = escapeHtml((name || '').trim().charAt(0).toUpperCase() || '?');
    const inner = photoUrl
      ? `<div class="tv-avatar__inner"><img src="${photoUrl}" alt="" /></div>`
      : `<div class="tv-avatar__inner" style="background:${color || '#546e7a'}">${initial}</div>`;
    return `<div class="tv-avatar${extraClass ? ' ' + extraClass : ''}">${extraClass === 'tv-avatar--win' ? CROWN_SVG : ''}${inner}</div>`;
  }

  // Empty dashed-ring avatar for the no-winner screen - same slot, no
  // player to show.
  function voidAvatarHtml() {
    return `<div class="tv-avatar tv-avatar--void">${VOID_BALL_SVG}</div>`;
  }

  // Next-up pill / facts-strip avatar - same photo-or-fallback pattern,
  // no ring, smaller (see tv-cast-screen-update-2.md's .tv-next__av,
  // reused as-is for the winner screen's runner-up fact).
  function smallAvatarHtml(photoUrl, color, name, className) {
    const initial = escapeHtml((name || '').trim().charAt(0).toUpperCase() || '?');
    if (photoUrl) return `<span class="${className}"><img src="${photoUrl}" alt="" /></span>`;
    return `<span class="${className}" style="background:${color || '#546e7a'}">${initial}</span>`;
  }

  function renderGame(state) {
    // Expected shape (kept intentionally small - see capacitorSetup.js):
    // { round, currentPlayerName, lives, defaultLives, aliveCount,
    //   totalPlayers, playedThisRoundCount, currentPlayerAvatar,
    //   currentPlayerAvatarColor, showTurnOrder, nextPlayerName,
    //   nextPlayerAvatar, nextPlayerAvatarColor, potTotal, gameId }
    // Avatar fields are data: URLs (or absent) - already resized small on
    // the phone before they're ever sent (resizeImageToDataUrl).
    stage.className = 'tv-stage';
    const alive = state.aliveCount ?? 0;
    const total = state.totalPlayers ?? 0;
    const name = state.currentPlayerName ?? '';
    // "Next up" only shows when the organizer has turned on Public turn
    // info AND there's actually a next player to name (nothing to show
    // once only one player is left) - see tv-cast-screen-update-2.md.
    const hasNext = !!(state.showTurnOrder && state.nextPlayerName);
    stage.innerHTML = `
      <div class="tv-ticket${hasNext ? ' has-next' : ''}">
        <section class="tv-main felt">
          <header class="tv-head">
            <div class="tv-brand">
              ${BRAND_BALL_SVG}
              <div class="tv-brand__lockup">
                <span class="tv-brand__name">KILLER POOL</span>
                <span class="tv-brand__sub">ELIMINATION</span>
              </div>
              <span class="tv-live">LIVE</span>
            </div>
            <div class="tv-round"><span class="tv-round__lbl">ROUND</span><span class="tv-round__num">${state.round ?? 1}</span></div>
          </header>

          <div class="tv-hero">
            ${heroAvatarHtml(state.currentPlayerAvatar, state.currentPlayerAvatarColor, name)}
            <div class="tv-hero__text">
              <div class="tv-hero__id">
                <span class="tv-upnow">UP NOW</span>
                <span class="tv-name">${escapeHtml(name)}</span>
              </div>
              ${livesHtml(state.lives ?? 0, state.defaultLives)}
            </div>
          </div>
          ${hasNext ? `
            <div class="tv-next" aria-label="Next up: ${escapeHtml(state.nextPlayerName)}">
              ${smallAvatarHtml(state.nextPlayerAvatar, state.nextPlayerAvatarColor, state.nextPlayerName, 'tv-next__av')}
              <span class="tv-next__lbl">NEXT UP</span>
              <span class="tv-next__name">${escapeHtml(state.nextPlayerName)}</span>
            </div>
          ` : ''}

          <div class="tv-stats">
            ${roundProgressStat(state.playedThisRoundCount ?? 0, alive)}
            ${playersRemainingStat(alive, total)}
          </div>
        </section>

        <div class="tv-perf" aria-hidden="true">
          <span class="tv-perf__felt felt"></span><span class="tv-perf__line"></span>
          <span class="tv-perf__hole tv-perf__hole--top"></span><span class="tv-perf__hole tv-perf__hole--bot"></span>
        </div>

        <aside class="tv-stub">
          ${state.potTotal > 0 ? `
            <div class="tv-prize">
              <span class="tv-prize__lbl">PRIZE POT</span>
              <span class="tv-prize__val">${fmtPot(state.potTotal)}</span>
            </div>
            <span class="tv-stub__rule"></span>
          ` : ''}
          ${qrBlockHtml(state.gameId, 'SCAN TO FOLLOW ALONG')}
        </aside>
      </div>
    `;
  }

  function renderWinner(state) {
    // { winnerName, winnerAvatar, winnerAvatarColor, rounds,
    //   playersBeaten, totalPlayers, runnerUpName, runnerUpAvatar,
    //   runnerUpAvatarColor, potTotal, gameId }
    stage.className = 'tv-stage';
    const name = state.winnerName ?? '';
    stage.innerHTML = `
      <div class="tv-ticket">
        <section class="tv-main felt">
          <header class="tv-head">
            <div class="tv-brand">
              ${BRAND_BALL_SVG}
              <div class="tv-brand__lockup">
                <span class="tv-brand__name">KILLER POOL</span>
                <span class="tv-brand__sub">ELIMINATION</span>
              </div>
              <span class="tv-flag tv-flag--done">GAME OVER</span>
            </div>
            <div class="tv-round"><span class="tv-round__lbl">ROUNDS</span><span class="tv-round__num">${state.rounds ?? 1}</span></div>
          </header>

          <div class="tv-hero">
            ${heroAvatarHtml(state.winnerAvatar, state.winnerAvatarColor, name, 'tv-avatar--win')}
            <div class="tv-hero__text">
              <div class="tv-hero__id">
                <span class="tv-winlbl">WINNER</span>
                <span class="tv-name">${escapeHtml(name)}</span>
              </div>
              <span class="tv-sub">Last player standing</span>
            </div>
          </div>

          <div class="tv-facts">
            <div class="tv-fact">
              <span class="tv-fact__lbl">RUNNER-UP</span>
              ${state.runnerUpName ? `<span class="tv-fact__val">${smallAvatarHtml(state.runnerUpAvatar, state.runnerUpAvatarColor, state.runnerUpName, 'tv-fact__av')}${escapeHtml(state.runnerUpName)}</span>` : `<span class="tv-fact__val">—</span>`}
            </div>
            <div class="tv-fact">
              <span class="tv-fact__lbl">PLAYERS BEATEN</span>
              <span class="tv-fact__val">${state.playersBeaten ?? 0} of ${state.totalPlayers ?? 0}</span>
            </div>
          </div>
        </section>

        <div class="tv-perf" aria-hidden="true">
          <span class="tv-perf__felt felt"></span><span class="tv-perf__line"></span>
          <span class="tv-perf__hole tv-perf__hole--top"></span><span class="tv-perf__hole tv-perf__hole--bot"></span>
        </div>

        <aside class="tv-stub">
          ${state.potTotal > 0 ? `
            <div class="tv-prize">
              <span class="tv-prize__lbl is-win">WINS THE POT</span>
              <span class="tv-prize__val">${fmtPot(state.potTotal)}</span>
              <span class="tv-prize__sub">${state.totalPlayers ?? 0} players</span>
            </div>
            <span class="tv-stub__rule"></span>
          ` : ''}
          ${qrBlockHtml(state.gameId, 'SCAN FOR THE RESULT')}
        </aside>
      </div>
    `;
  }

  function renderRoundEnded(state) {
    // { round, totalPlayers, potRollover, gameId } - Confirmation Shot
    // house rule: the lone survivor missed their own confirmation shot
    // too, so nobody won this round. totalPlayers is the roster
    // continuing into the restart (startNextRound() gives everyone their
    // lives back - it's a fresh restart with this roster, not a
    // continuation, so there's no smaller "still alive" count to show).
    stage.className = 'tv-stage';
    stage.innerHTML = `
      <div class="tv-ticket">
        <section class="tv-main felt">
          <header class="tv-head">
            <div class="tv-brand">
              ${BRAND_BALL_SVG}
              <div class="tv-brand__lockup">
                <span class="tv-brand__name">KILLER POOL</span>
                <span class="tv-brand__sub">ELIMINATION</span>
              </div>
              <span class="tv-flag tv-flag--void">ROUND ENDED</span>
            </div>
            <div class="tv-round"><span class="tv-round__lbl">ROUND</span><span class="tv-round__num">${state.round ?? 1}</span></div>
          </header>

          <div class="tv-hero">
            ${voidAvatarHtml()}
            <div class="tv-hero__text">
              <div class="tv-hero__id">
                <span class="tv-winlbl tv-winlbl--void">ROUND ${state.round ?? 1} RESULT</span>
                <span class="tv-name tv-name--void">NO WINNER</span>
              </div>
              <span class="tv-sub">Nobody confirmed the win</span>
            </div>
          </div>

          <div class="tv-facts">
            <div class="tv-fact">
              <span class="tv-fact__lbl">PLAYERS</span>
              <span class="tv-fact__val">${state.totalPlayers ?? 0} going into the restart</span>
            </div>
            <div class="tv-fact">
              <span class="tv-fact__lbl">NEXT</span>
              <span class="tv-fact__val">New round, full lives</span>
            </div>
          </div>
        </section>

        <div class="tv-perf" aria-hidden="true">
          <span class="tv-perf__felt felt"></span><span class="tv-perf__line"></span>
          <span class="tv-perf__hole tv-perf__hole--top"></span><span class="tv-perf__hole tv-perf__hole--bot"></span>
        </div>

        <aside class="tv-stub">
          ${state.potRollover > 0 ? `
            <div class="tv-prize">
              <span class="tv-prize__lbl">POT ROLLS OVER</span>
              <span class="tv-prize__val is-void">${fmtPot(state.potRollover)}</span>
              <span class="tv-prize__sub">Carries into the next round</span>
            </div>
            <span class="tv-stub__rule"></span>
          ` : ''}
          ${qrBlockHtml(state.gameId, 'SCAN TO FOLLOW ALONG')}
        </aside>
      </div>
    `;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  // Guarded: this file is previewed in a plain browser during development
  // (no `cast` global there), and only actually runs inside the Cast SDK
  // runtime when loaded on a real Chromecast device.
  if (typeof cast !== 'undefined' && cast.framework) {
    const context = cast.framework.CastReceiverContext.getInstance();

    context.addCustomMessageListener(NAMESPACE, (event) => {
      const data = event.data;
      if (!data || data.type === 'idle') { renderIdle(); return; }
      if (data.type === 'game') { renderGame(data); return; }
      if (data.type === 'winner') { renderWinner(data); return; }
      if (data.type === 'roundEnded') { renderRoundEnded(data); return; }
    });

    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true; // keep the receiver alive between rounds
    context.start(options);
  } else {
    console.warn('Cast SDK not available — showing idle state (expected in a plain browser preview).');
  }
</script>
</body>
</html>
