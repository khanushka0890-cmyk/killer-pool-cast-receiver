<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Killer Pool — Cast Receiver</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    color: #e8edf2;
    font-family: 'Barlow', sans-serif;
    overflow: hidden;
    /* Same felt weave used on the app's own hero card - a flat #0c1117
       fill left the wide dead space between the two game-state columns
       reading as empty/broken rather than as deliberate breathing room. */
    background-color: #0c1117;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.16) 0 1px, transparent 1px 6px);
  }
  /* Real landscape layout, not a portrait column centered on a wide
     screen. Was a single flex-column stack (badge, label, name, pips,
     status all centered) sized in vw - technically fills a landscape
     viewport, but a lone centered column of text doesn't span the WIDTH
     of a 16:9 screen on its own, so the actual content read as a narrow
     vertical strip with huge empty gutters left/right - exactly what
     "vertical on a horizontal screen" looks like, even though nothing
     was literally rotated. Fixed by actually using the width: identity
     (round + up now + name) on the left, stats (pips + remaining) on
     the right, both vertically centered, one row. */
  .stage {
    width: 100vw; height: 100vh;
    padding: 4vh 6vw;
  }
  .stage.idle {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  /* Grid instead of flex+justify-content:center for the game state -
     flex-grow ratios on left-aligned content left a large, unpredictable
     dead gap between the two columns (justify-content centers the ROW as
     a unit rather than reliably stretching each item to fill its share).
     Grid's fr columns are a hard, deterministic split of the actual
     available width, so both columns start exactly where intended. */
  .stage.game {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    column-gap: 4vw;
    align-items: center;
    height: 100%;
    /* Both columns' actual content (a name, a row of pips) is much
       narrower than an even split of a 1920px+ screen, so stretching the
       grid full-bleed just moved the old dead gap from "between" the
       columns to "inside" them - capped and centered instead, like a
       poster laid out on the felt rather than smeared edge to edge. */
    max-width: 1160px;
    margin: 0 auto;
  }
  .left-col { min-width: 0; text-align: left; }
  .right-col { min-width: 0; text-align: left; padding-left: 4vw; border-left: 2px solid #1e2d40; height: fit-content; }
  .round-badge {
    display: inline-block;
    font-size: 1.6vw;
    letter-spacing: 0.3vw;
    color: #7a6010;
    font-weight: 700;
    background: #1a1508;
    border: 1px solid #3a2e0f;
    border-radius: 100px;
    padding: 0.8vh 1.6vw;
    margin-bottom: 3vh;
  }
  .up-now-label {
    font-size: 1.4vw;
    letter-spacing: 0.4vw;
    color: #7a6010;
    font-weight: 700;
    margin-bottom: 1vh;
  }
  .player-name {
    font-family: 'Bebas Neue', sans-serif;
    /* vh, not vw, for the dimension actually in short supply on a
       landscape screen - vw made this scale with the WIDE axis, which
       is exactly backwards for a screen that's short and wide. */
    font-size: 14vh;
    letter-spacing: 0.3vw;
    line-height: 1;
    color: #FFD700;
    text-shadow: 0 0 60px rgba(255,215,0,0.25);
    /* A name long enough to not fit in one line at 14vh used to hard-wrap
       mid-word ("CHRISTOP / HER") - renderGame now grades the font size
       down by name length instead, so a long name shrinks to fit on one
       line rather than getting torn in half. */
    white-space: nowrap;
  }
  .player-name.len-long { font-size: 9vh; }
  .player-name.len-verylong { font-size: 6.5vh; }
  .stat-label {
    font-size: 1.3vw;
    letter-spacing: 0.3vw;
    color: #78909c;
    font-weight: 700;
    margin-bottom: 1.5vh;
  }
  .pips { display: flex; gap: 1vw; flex-wrap: wrap; margin-bottom: 3vh; }
  .pip {
    width: 2.4vw; height: 2.4vw; border-radius: 50%;
    background: #1e2530; border: 3px solid #3a4250;
  }
  .pip.on { background: #FFD700; border-color: #b8942a; }
  .status-line {
    font-size: 1.5vw;
    color: #78909c;
  }
  .status-line b { color: #e8edf2; font-size: 1.8vw; }
  .idle-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 7vw;
    letter-spacing: 0.5vw;
    color: #FFD700;
  }
  .idle-sub {
    font-size: 1.4vw;
    letter-spacing: 0.3vw;
    color: #4a5568;
    margin-top: 2vh;
  }
  .pool-ball {
    width: 7vh; height: 7vh;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a3a3a, #0a0a0a 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.6vh;
    color: #fff;
    margin-bottom: 3vh;
  }
  .idle .pool-ball { margin-left: auto; margin-right: auto; }
</style>
</head>
<body>
  <div class="stage idle" id="stage">
    <div class="pool-ball">8</div>
    <div class="idle-title">KILLER POOL</div>
    <div class="idle-sub">WAITING FOR ORGANISER TO START A GAME…</div>
  </div>

<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
  // Custom message namespace the phone app (sender) publishes state on.
  // Must match CAST_NAMESPACE in the app's Chromecast integration.
  const NAMESPACE = 'urn:x-cast:com.killerpool.state';
  const stage = document.getElementById('stage');

  function renderIdle() {
    stage.className = 'stage idle';
    stage.innerHTML = `
      <div class="pool-ball">8</div>
      <div class="idle-title">KILLER POOL</div>
      <div class="idle-sub">WAITING FOR ORGANISER TO START A GAME…</div>
    `;
  }

  function renderGame(state) {
    // Expected shape (kept intentionally small — see capacitorSetup.js):
    // { round, currentPlayerName, lives, defaultLives, aliveCount, totalPlayers }
    stage.className = 'stage game';
    const total = Math.max(state.defaultLives || 3, state.lives || 0);
    const pips = Array.from({ length: total }, (_, i) =>
      `<div class="pip ${i < state.lives ? 'on' : ''}"></div>`
    ).join('');
    const name = state.currentPlayerName ?? '';
    const nameClass = name.length > 14 ? 'len-verylong' : name.length > 9 ? 'len-long' : '';
    stage.innerHTML = `
      <div class="left-col">
        <div class="round-badge">ROUND ${state.round ?? 1}</div>
        <div class="up-now-label">UP NOW</div>
        <div class="player-name ${nameClass}">${escapeHtml(name)}</div>
      </div>
      <div class="right-col">
        <div class="stat-label">LIVES</div>
        <div class="pips">${pips}</div>
        <div class="status-line"><b>${state.aliveCount ?? '–'}</b> of <b>${state.totalPlayers ?? '–'}</b><br/>players remaining</div>
      </div>
    `;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  // Guarded: this file is previewed in a plain browser during development
  // (no `cast` global there), and only actually runs inside the Cast SDK
  // runtime when loaded on a real Chromecast device.
  if (typeof cast !== 'undefined' && cast.framework) {
    const context = cast.framework.CastReceiverContext.getInstance();

    context.addCustomMessageListener(NAMESPACE, (event) => {
      const data = event.data;
      if (!data || data.type === 'idle') { renderIdle(); return; }
      if (data.type === 'game') { renderGame(data); return; }
    });

    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true; // keep the receiver alive between rounds
    context.start(options);
  } else {
    console.warn('Cast SDK not available — showing idle state (expected in a plain browser preview).');
  }
</script>
</body>
</html>
